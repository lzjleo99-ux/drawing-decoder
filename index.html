<style>
/* 本页专用：图纸解译报告的排版（历史、报告栏、图纸 sheet 内部结构）。
   通用样式见 theme.css。 */
/* ---------- history ---------- */
.hist{list-style:none;margin:0;padding:0}
.hist li{border-bottom:1px dashed var(--line)}
.hist li:last-child{border-bottom:0}
.hist button{width:100%;text-align:left;background:none;border:0;padding:8px 2px;cursor:pointer;color:inherit;font-family:inherit}
.hist button:hover .ht{color:var(--accent)}
.ht{font-size:12.5px;font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hd{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.07em;color:var(--ink3);text-transform:uppercase}
.empty{font-size:12px;color:var(--ink3);padding:4px 0}

/* ---------- report bar ---------- */
.rbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.rbar .st{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}
.rbar .acts{display:flex;gap:8px}

/* ---------- the sheet ---------- */
.sheet{background:var(--sheet);border:1px solid var(--line2);border-radius:2px;box-shadow:var(--shadow);
  padding:9px;position:relative;min-width:0}
.frame{border:1px solid var(--line);padding:22px 24px 30px}
@media (max-width:560px){.frame{padding:16px 14px 22px}.sheet{padding:6px}}
.demo-flag{position:absolute;top:-1px;right:-1px;background:var(--brass);color:var(--on-accent);font-family:var(--f-mono);
  font-size:9.5px;letter-spacing:.14em;padding:3px 9px;text-transform:uppercase;z-index:2}

/* title block */
.tblock{border:1px solid var(--line2);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:22px}
@media (max-width:700px){.tblock{grid-template-columns:repeat(2,minmax(0,1fr))}}
.titleVal{display:flex;align-items:baseline;gap:8px}
.titleEditBtn{background:none;border:0;padding:2px 4px;font-size:15px;line-height:1;cursor:pointer;color:var(--ink3);flex-shrink:0}
.titleEditBtn:hover{color:var(--accent)}
.titleEditRow{display:flex;gap:8px;align-items:center;width:100%}
.titleEditRow input{flex:1;min-width:0;font:inherit;font-weight:700;padding:3px 6px;border:1px solid var(--accent);border-radius:2px;background:var(--sheet);color:var(--ink)}
.titleEditRow button{flex-shrink:0;font-size:12px;padding:4px 9px;border:1px solid var(--line);border-radius:2px;background:var(--sheet);color:var(--ink);cursor:pointer}
.tblock .cell{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:7px 10px;min-width:0}
.tblock .cell:nth-child(4n){border-right:0}
@media (max-width:700px){.tblock .cell:nth-child(4n){border-right:1px solid var(--line)}.tblock .cell:nth-child(2n){border-right:0}}
.tblock .cell.wide{grid-column:1/-1;border-right:0}
.tblock .k{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink3);display:block}
.tblock .v{font-size:13.5px;font-weight:500;margin-top:1px;word-break:break-word;font-variant-numeric:tabular-nums}
.tblock .cell.wide .v{font-family:var(--f-disp);font-size:19px;font-weight:700;line-height:1.3}
.gauge{display:flex;align-items:center;gap:7px;margin-top:3px}
.gauge .track{flex:1;height:4px;background:var(--sink);position:relative}
.gauge .track i{position:absolute;inset:0 auto 0 0;background:var(--accent)}
.gauge b{font-family:var(--f-mono);font-size:11px;font-weight:500;font-variant-numeric:tabular-nums}

/* sections */
.sec{margin-top:26px;scroll-margin-top:70px}
.sec:first-of-type{margin-top:0}
.sec-h{display:flex;align-items:baseline;gap:11px;border-bottom:1px solid var(--line2);padding-bottom:6px;margin-bottom:13px}
.sec-h .n{font-family:var(--f-mono);font-size:11px;font-weight:500;color:var(--accent);letter-spacing:.06em;flex:none}
.sec-h h3{font-size:15.5px;font-weight:600;flex:1;min-width:0}
.sec-h .n-en{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink3);flex:none}
.lead{font-size:15px;line-height:1.78}
.body-p{margin-top:10px;color:var(--ink2);max-width:68ch}
.body-p:first-child{margin-top:0}
.sub{font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);margin:16px 0 7px}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{border:1px solid var(--line);border-radius:2px;padding:2px 9px;font-size:11.5px;color:var(--ink2);background:var(--sheet2)}

.tw{overflow-x:auto;margin-top:6px}
table.tb{width:100%;border-collapse:collapse;font-size:13px;min-width:430px}
table.tb th{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);
  text-align:left;font-weight:500;padding:5px 10px 5px 0;border-bottom:1px solid var(--line2);white-space:nowrap;vertical-align:bottom}
table.tb td{padding:7px 10px 7px 0;border-bottom:1px dashed var(--line);vertical-align:top;color:var(--ink2)}
table.tb td:first-child{color:var(--ink);font-weight:500}
table.tb td.num,table.tb th.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
table.tb tr:last-child td{border-bottom:0}

ul.bul{margin:8px 0 0;padding-left:0;list-style:none}
ul.bul li{position:relative;padding-left:16px;margin-top:6px;color:var(--ink2)}
ul.bul li::before{content:"";position:absolute;left:2px;top:.72em;width:5px;height:1px;background:var(--line2)}
ol.flow{margin:8px 0 0;padding:0;list-style:none;counter-reset:f}
ol.flow li{counter-increment:f;position:relative;padding-left:30px;margin-top:8px;color:var(--ink2)}
.lesson{display:grid;grid-template-columns:29px minmax(0,1fr);gap:0 13px;padding:10px 0;border-bottom:1px dashed var(--line)}
.lesson:last-of-type{border-bottom:0}
.lesson .ln{font-family:var(--f-mono);font-size:10.5px;color:var(--accent);border:1px solid var(--line);
  width:25px;height:25px;display:flex;align-items:center;justify-content:center}
.lesson .lt{font-weight:600;font-size:13.5px}
.lesson .lw{font-family:var(--f-mono);font-size:10.5px;color:var(--ink3);margin-left:9px;font-weight:400}
.lesson .lb{font-size:13px;color:var(--ink2);margin-top:4px}
.lesson .lwhy{font-size:12.5px;color:var(--ink3);margin-top:4px;padding-left:14px;position:relative}
.lesson .lwhy::before{content:"∵";position:absolute;left:0;color:var(--accent)}
ol.flow li::before{content:counter(f);position:absolute;left:0;top:1px;font-family:var(--f-mono);font-size:10px;
  color:var(--accent);border:1px solid var(--line);width:19px;height:19px;display:flex;align-items:center;justify-content:center}

/* material cards */
.mat{border:1px solid var(--line);border-left:3px solid var(--brass);background:var(--sheet2);padding:14px 15px;margin-top:12px;border-radius:2px}
.mat-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:4px}
.mat-h .g{font-family:var(--f-disp);font-size:18px;font-weight:700;letter-spacing:.01em}
.mat-h .s{font-family:var(--f-mono);font-size:10.5px;color:var(--brass);border:1px solid var(--brass);padding:1px 7px}
.mat-h .c{font-size:12px;color:var(--ink3)}
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:14px 26px;margin-top:12px}
.prop{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:12.5px;padding:4px 0;border-bottom:1px dashed var(--line)}
.prop .pn{color:var(--ink2);min-width:0}
.prop .pv{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:500;min-width:0;max-width:60%;text-align:right}
.prop .pc{display:block;font-family:var(--f-body);font-size:10.5px;color:var(--ink3);font-weight:400;text-align:right;white-space:normal}

/* risk */
.risk{border:1px solid var(--line);border-left:3px solid var(--ink3);padding:10px 13px;margin-top:9px;background:var(--sheet2);border-radius:2px}
.risk.high{border-left-color:var(--crit)} .risk.mid{border-left-color:var(--warn)} .risk.low{border-left-color:var(--ok)}
.risk-h{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.pill{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;padding:1px 7px;border:1px solid;border-radius:2px}
.pill.high{color:var(--crit);border-color:var(--crit);background:var(--crit-wash)}
.pill.mid{color:var(--warn);border-color:var(--warn);background:var(--warn-wash)}
.pill.low{color:var(--ok);border-color:var(--ok);background:var(--ok-wash)}
.risk-t{font-weight:600;font-size:13.5px}
.risk-b{font-size:12.5px;color:var(--ink2);margin-top:4px}
.risk-s{font-size:12.5px;margin-top:5px;color:var(--ink2);padding-left:14px;position:relative}
.risk-s::before{content:"→";position:absolute;left:0;color:var(--accent)}

/* code notes */
.cn{display:grid;grid-template-columns:74px minmax(0,1fr);gap:0 14px;border-bottom:1px dashed var(--line);padding:9px 0}
.cn:last-child{border-bottom:0}
.cn .loc{font-family:var(--f-mono);font-size:11px;color:var(--accent);padding-top:2px}
.cn code{font-family:var(--f-mono);font-size:12px;background:var(--sink);padding:2px 6px;display:block;
  white-space:pre-wrap;word-break:break-word;border-left:2px solid var(--line2)}
.cn .note{font-size:12.5px;color:var(--ink2);margin-top:5px}
@media (max-width:560px){.cn{grid-template-columns:minmax(0,1fr);gap:4px}}

.gloss{display:grid;grid-template-columns:repeat(auto-fit,minmax(255px,1fr));gap:3px 22px;margin-top:6px}
.gloss div{font-size:12.5px;padding:5px 0;border-bottom:1px dashed var(--line);color:var(--ink2)}
.gloss b{font-family:var(--f-mono);font-size:12px;color:var(--ink);font-weight:500;margin-right:7px}

.note-box{border:1px solid var(--line);background:var(--sheet2);padding:11px 13px;margin-top:14px;font-size:12px;
  color:var(--ink3);line-height:1.6;border-radius:2px}
.note-box b{color:var(--ink2);font-weight:600}

.qa{border-top:1px solid var(--line);margin-top:22px;padding-top:16px}
.qa-item{margin-top:14px}
.qa-q{font-weight:600;font-size:13.5px;display:flex;gap:9px}
.qa-q::before{content:"Q";font-family:var(--f-mono);font-size:11px;color:var(--accent);border:1px solid var(--line);
  width:19px;height:19px;display:flex;align-items:center;justify-content:center;flex:none;margin-top:1px}
.qa-a{font-size:13.5px;color:var(--ink2);margin-top:6px;padding-left:28px;white-space:pre-wrap}

/* ask panel */
.askBar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:9px;font-size:11.5px;color:var(--ink3)}
.askBar label{font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase}
.askBar select{font-size:12px;padding:4px 7px;border:1px solid var(--line);border-radius:2px;background:var(--sheet);color:var(--ink)}
.askNote{font-size:11px;color:var(--ink3)}
.ask{display:flex;gap:9px;align-items:flex-end}
.ask textarea{flex:1;min-height:42px;max-height:150px;resize:vertical;font-family:inherit;font-size:13.5px;
  padding:9px 11px;border:1px solid var(--line);border-radius:2px;background:var(--sheet2);color:var(--ink)}
.ask textarea:focus{border-color:var(--accent);outline:none}
.ask textarea:disabled{opacity:.6;cursor:not-allowed}
.presets{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.presets button{border:1px solid var(--line);background:var(--sheet2);color:var(--ink2);font-family:inherit;
  font-size:11.5px;padding:3px 9px;border-radius:2px;cursor:pointer}
.presets button:hover{border-color:var(--accent);color:var(--accent)}

/* toast */
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(12px);background:var(--ink);
  color:var(--paper);font-size:13px;padding:9px 17px;border-radius:3px;opacity:0;pointer-events:none;
  transition:opacity .2s,transform .2s;z-index:90;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

#printhost{position:fixed;left:-12000px;top:0;width:772px;background:#fff}
.skel{height:11px;background:var(--sink);margin-bottom:9px;border-radius:2px}
</style>
